[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-copilot"
version = "0.1.0"
description = "Local-first human-in-the-loop AI job search copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "playwright>=1.45",
  "pypdf>=4.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
openai = [
  "openai>=1.35",
]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
