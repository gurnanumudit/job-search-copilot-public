<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sample Application</title>
  </head>
  <body>
    <form>
      <label for="full_name">Full Name *</label>
      <input id="full_name" type="text" required />

      <label for="email">Email *</label>
      <input id="email" type="email" required />

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" type="url" />

      <label for="sponsorship">Will you now or in the future require sponsorship? *</label>
      <select id="sponsorship" required>
        <option value="">Select one</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="why_company">Why Replit?</label>
      <textarea id="why_company"></textarea>
    </form>
  </body>
</html>
